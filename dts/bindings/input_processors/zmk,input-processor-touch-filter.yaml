# SPDX-License-Identifier: MIT

description: Drops small movements after idle and smoothly lowers the gain of slow movements

compatible: "zmk,input-processor-touch-filter"

include: ip_zero_param.yaml

properties:
  idle-ms:
    type: int
    default: 150
  start-threshold:
    type: int
    default: 10
  slow-gain-percent:
    type: int
    default: 60
  slow-speed:
    type: int
    default: 3
    description: Speed (counts per 16 ms) at or below which slow-gain-percent is applied
  full-speed:
    type: int
    default: 16
    description: Speed (counts per 16 ms) at or above which the gain is 100%
