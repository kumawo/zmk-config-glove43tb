# SPDX-License-Identifier: MIT

description: Drops small movements after idle and applies a speed-dependent gain (S-curve)

compatible: "zmk,input-processor-touch-filter"

include: ip_zero_param.yaml

properties:
  idle-ms:
    type: int
    default: 150
  start-threshold:
    type: int
    default: 10
  slow-speed:
    type: int
    default: 2
    description: Speed (counts per 8 ms) at or below which the preset's minimum gain is applied
  full-speed:
    type: int
    default: 12
    description: Speed (counts per 8 ms) at or above which the gain is 100%
  min-gain-percents:
    type: array
    required: true
    description: Minimum gain (%) for each preset selectable with the pointer preset behavior
